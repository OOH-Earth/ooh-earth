name: release-please

# Watches main for Conventional Commits and keeps a standing "release PR"
# up to date with the next version bump + CHANGELOG.md entry. Merging that
# PR is what actually cuts the release: release-please then tags the commit
# and publishes GitHub Release notes. Nothing here ever runs `npm publish` —
# this app isn't distributed via the npm registry, so release-please only
# manages package.json's version field, CHANGELOG.md, and the git tag/GitHub
# Release. See RELEASE_PROCESS.md before merging your first release PR.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please's push uses this workflow's own GITHUB_TOKEN, and
      # GitHub excludes GITHUB_TOKEN-authored pushes from triggering other
      # workflows (anti-recursion rule) -- so the release PR it just
      # created/updated gets zero CI/CodeQL checks and can never satisfy
      # required-status-checks branch protection on its own. workflow_dispatch
      # is explicitly exempt from that suppression, so re-dispatch both
      # required-check workflows directly onto the release PR's branch. No
      # PAT, no force-push, no branch-protection change. See CI_PIPELINE.md
      # Decision Register #8 and RELEASE_PROCESS.md.
      - name: Trigger CI + CodeQL verification on the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
        run: |
          branches=$(node -e "
            const prs = JSON.parse(process.env.PRS_JSON);
            for (const pr of prs) console.log(pr.headBranchName);
          ")
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "Dispatching CI + CodeQL on release PR branch: $branch"
            gh workflow run ci.yml --ref "$branch"
            gh workflow run codeql.yml --ref "$branch"
          done <<< "$branches"
